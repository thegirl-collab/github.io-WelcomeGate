name: Build Snyder Family v1

on:
  push:
    branches:
      - build/snyder-family-v1-full
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble full Snyder Family app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          flutter create --platforms=android --org com.snyderfamily --project-name snyder_family app
          rm -rf app/lib
          cp -R .snyder_v1/src app/lib
          cd app

          cat > pubspec.yaml <<'EOF'
          name: snyder_family
          description: Snyder Family private household operating system.
          publish_to: "none"
          version: 1.0.0+100

          environment:
            sdk: ">=3.6.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            sqflite: ^2.4.2
            path: ^1.9.1
            path_provider: ^2.1.5
            intl: ^0.20.2
            crypto: ^3.0.6
            cryptography: ^2.7.0
            pdf: ^3.11.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0
            flutter_launcher_icons: ^0.14.4

          flutter:
            uses-material-design: true
            assets:
              - assets/snyder_logo.png

          flutter_launcher_icons:
            android: true
            image_path: assets/snyder_logo.png
            adaptive_icon_background: "#050A12"
            adaptive_icon_foreground: assets/snyder_logo.png
            min_sdk_android: 23
          EOF

          mkdir -p assets
          python3 - <<'PY'
          import struct, zlib, math
          W=H=512
          px=bytearray(W*H*4)
          def put(x,y,c):
              if 0<=x<W and 0<=y<H:
                  i=(y*W+x)*4; px[i:i+4]=bytes(c)
          for y in range(H):
              for x in range(W):
                  d=math.hypot(x-W/2,y-H/2)/(W*.72)
                  g=max(0,1-d)
                  put(x,y,(5+int(7*g),10+int(10*g),18+int(18*g),255))
          def disk(cx,cy,r,c):
              rr=r*r
              for y in range(max(0,cy-r),min(H,cy+r+1)):
                  dy=(y-cy)*(y-cy)
                  for x in range(max(0,cx-r),min(W,cx+r+1)):
                      if (x-cx)*(x-cx)+dy<=rr: put(x,y,c)
          def line(x0,y0,x1,y1,w,c):
              dx=x1-x0; dy=y1-y0; n=max(abs(dx),abs(dy),1)
              for j in range(n+1):
                  t=j/n; disk(round(x0+dx*t),round(y0+dy*t),w//2,c)
          # border glow
          for inset,col in [(18,(25,120,210,255)),(24,(40,230,255,255)),(31,(11,27,44,255))]:
              line(inset,inset,W-inset,inset,8,col); line(inset,H-inset,W-inset,H-inset,8,col)
              line(inset,inset,inset,H-inset,8,col); line(W-inset,inset,W-inset,H-inset,8,col)
          # crescent moon
          disk(145,135,70,(169,124,255,255)); disk(174,120,66,(7,14,25,255))
          # house roof and walls
          for w,c in [(34,(30,226,255,255)),(22,(212,221,235,255))]:
              line(105,245,256,92,w,c); line(256,92,410,245,w,c)
              line(125,230,125,388,w,c); line(388,225,388,388,w,c)
          # Snyder S
          for w,c in [(56,(36,226,255,255)),(40,(217,224,236,255))]:
              line(338,205,205,205,w,c); line(205,205,180,235,w,c)
              line(180,235,320,300,w,c); line(320,300,342,330,w,c); line(342,330,185,360,w,c)
          # crystal
          line(256,365,256,438,20,(179,121,255,255))
          line(256,365,226,405,12,(103,215,255,255)); line(256,365,286,405,12,(103,215,255,255))
          # raven
          disk(346,126,24,(12,14,24,255)); disk(363,133,14,(12,14,24,255))
          line(337,145,315,190,20,(12,14,24,255)); line(343,146,375,186,16,(12,14,24,255))
          line(372,130,393,124,7,(12,14,24,255)); disk(356,121,3,(52,231,255,255))
          raw=b''.join(b'\x00'+bytes(px[y*W*4:(y+1)*W*4]) for y in range(H))
          def chunk(tag,data):
              return struct.pack(">I",len(data))+tag+data+struct.pack(">I",zlib.crc32(tag+data)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack(">IIBBBBB",W,H,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          open('assets/snyder_logo.png','wb').write(png)
          PY

          sed -i 's/android:label="snyder_family"/android:label="Snyder Family"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false" android:fullBackupContent="false" android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml
          find android/app/src -name AndroidManifest.xml -print0 | xargs -0 sed -i '/android.permission.INTERNET/d'

          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('lib/screens/life.dart')
          s=p.read_text()
          s=s.replace("child: const Text('Save'))]))));","child: const Text('Save'))])));")
          p.write_text(s)
          p=Path('lib/screens/property.dart')
          s=p.read_text()
          s=s.replace("subtitle: Text('${shortDate(parseDate(x['timestamp']))} • ${x['record_type']} ${x['record_id']}')),","subtitle: Text('${shortDate(parseDate(x['timestamp']))} • ${x['record_type']} ${x['record_id']}'))),")
          p.write_text(s)
          PYFIX

          flutter pub get
          dart run flutter_launcher_icons
          rm -f test/widget_test.dart
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Verify privacy and APK
        shell: bash
        run: |
          set -euo pipefail
          cd app
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "APK unexpectedly requests INTERNET" >&2
            exit 1
          fi
          cp "$APK" ../Snyder_Family_v1.0.0_phone_only.apk
          sha256sum ../Snyder_Family_v1.0.0_phone_only.apk | tee ../SHA256.txt
          {
            echo "Snyder Family v1.0.0"
            echo "Phone-only local storage"
            echo "Cloud backup disabled"
            echo "INTERNET permission absent and verified"
            echo "Release APK signature verified"
          } > ../BUILD_REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Snyder-Family-v1.0.0-phone-only
          path: |
            Snyder_Family_v1.0.0_phone_only.apk
            BUILD_REPORT.txt
            SHA256.txt
          if-no-files-found: error
