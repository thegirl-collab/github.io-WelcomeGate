                const SizedBox(height:12),
                CardX(accent:C.blue,child:Column(children:[titleRow(Icons.build_circle_outlined,'Property Expenses'),if(e.isEmpty)const Padding(padding:EdgeInsets.all(8),child:Text('No expenses recorded.',style:TextStyle(color:C.muted))),...e.take(8).map((x)=>ListTile(contentPadding:EdgeInsets.zero,title:Text(x['category'].toString()),subtitle:Text('${x['vendor']} • ${x['note']}'),trailing:Text(money(n(x['amount'])))))])),
