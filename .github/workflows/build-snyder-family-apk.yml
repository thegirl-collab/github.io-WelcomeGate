          }
          DART

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i 's/android:label="snyder_family"/android:label="Snyder Family"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false" android:fullBackupContent="false" android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml
          find android/app/src -name AndroidManifest.xml -print0 | xargs -0 sed -i '/android.permission.INTERNET/d'

          flutter pub get
          dart run flutter_launcher_icons
          dart format lib/main.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Verify phone-only APK
        shell: bash
        run: |
          set -euo pipefail
          cd snyder_build
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "ERROR: APK requests INTERNET permission" >&2
            exit 1
          fi
          cp "$APK" ../Snyder_Family_v0.3.0_phone_only.apk
          {
            echo "Snyder Family v0.3.0 private alpha"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Storage: Android app-private SQLite database"
            echo "Cloud backup: disabled"
            echo "INTERNET permission: absent (verified)"
            echo "Property ledger: append/reversal model"
          } > ../BUILD_REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Snyder-Family-v0.3.0-phone-only
          path: |
            Snyder_Family_v0.3.0_phone_only.apk
            BUILD_REPORT.txt
          if-no-files-found: error
