              final amount=double.tryParse(a.text);if(ok==true&&amount!=null&&amount>0){await Db.i.add('expenses',{'amount':amount,'expense_date':DateTime.now().toIso8601String(),'category':cat.text.trim().isEmpty?'Other':cat.text.trim(),'vendor':vendor.text.trim(),'note':note.text.trim()});refresh();}
