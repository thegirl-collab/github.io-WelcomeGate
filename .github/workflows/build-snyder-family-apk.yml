          class PropertyHub extends StatelessWidget {
            const PropertyHub({super.key,required this.token,required this.refresh}); final int token; final VoidCallback refresh;
            Future<Map<String,dynamic>> load()async{
              final ps=await Db.i.rows('property'),l=await Db.i.rows('ledger',order:'entry_date DESC'),e=await Db.i.rows('expenses',order:'expense_date DESC'),j=await Db.i.rows('journal',order:'created_at DESC');
              double payments=0,charges=0,credits=0;for(final x in l){final a=n(x['amount']);if(x['entry_type']=='payment'||x['entry_type']=='reversal')payments+=a;else if(x['entry_type']=='charge')charges+=a;else if(x['entry_type']=='credit')credits+=a;}
              final expenses=e.fold<double>(0,(s,x)=>s+n(x['amount']));
              return {'p':ps.first,'l':l,'e':e,'j':j,'balance':charges-payments-credits,'cash':payments-expenses};
            }
