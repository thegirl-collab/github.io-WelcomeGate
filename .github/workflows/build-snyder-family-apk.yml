              if(ok==true&&note.text.trim().isNotEmpty){await Db.i.add('journal',{'created_at':DateTime.now().toIso8601String(),'category':cat.text.trim().isEmpty?'General':cat.text.trim(),'note':note.text.trim(),'parent_id':null});refresh();}
